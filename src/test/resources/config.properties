# Execution Configurations
env=qa
browser=chrome
headless=false
execution.mode=local
selenium.grid.url=http://localhost:4444
timeout.explicit.seconds=10

# APIs (WireMock local or QA staging)
base.api.url=http://localhost:8089
auth.token=Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.testToken

# Web UI (ParaBank Demo or Card Portal)
base.ui.url=https://parabank.parasoft.com/parabank

# Relational Database (HikariCP / PostgreSQL)
db.url=jdbc:postgresql://localhost:5432/fintech_db
db.username=fintech_user
db.password=fintech_pass
db.pool.max.size=10

# Apache Kafka Event Streaming
kafka.bootstrap.servers=localhost:9092
kafka.payment.topic=payment-events
kafka.consumer.group=fintech-qa-consumer-group

# Observability (InfluxDB & Grafana)
metrics.enabled=true
influxdb.url=http://localhost:8086
influxdb.token=fintech-super-secret-token
influxdb.org=fintech-qa
influxdb.bucket=test-metrics
